name: saanjh-private-gateway

services:
  api:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Voicebox remains on the host and is never published by this stack.
      VOICEBOX_URL: http://host.docker.internal:17493
      DATABASE_PATH: /data/saanjh.db
    ports:
      # Only the host and a host-run tunnel connector can reach FastAPI.
      - "127.0.0.1:8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - saanjh-data:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/livez', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  saanjh-data:
