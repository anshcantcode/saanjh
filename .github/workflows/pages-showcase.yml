name: Deploy Saanjh presentation

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'showcase/**'
      - '.github/workflows/pages-showcase.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: showcase/package-lock.json
      - run: npm ci
        working-directory: showcase
      - run: npm run build
        working-directory: showcase
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: showcase/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy presentation
        id: deployment
        uses: actions/deploy-pages@v4
